name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RenderCraft-v1.0.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCraft-Android-v1.0.0-APK
          path: RenderCraft-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: RenderCraft-v1.0.0.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## RenderCraft Android APK 极速安装包
            - 极简、轻量级、高流畅度代码渲染工作室
            - 支持 SVG、HTML、XML 实时预览与智能识别
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
